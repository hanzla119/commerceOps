services:
  postgres:
    image: postgres:16-alpine
    container_name: medusa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medusa-v2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medusa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - ./backend/medusa-config.ts:/app/medusa-config.ts
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/medusa-v2?ssl_mode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret
      COOKIE_SECRET: supersecret
      STORE_CORS: http://localhost:8000,http://127.0.0.1:8000
      ADMIN_CORS: http://localhost:9000,http://127.0.0.1:9000,http://localhost:5173
      AUTH_CORS: http://localhost:9000,http://127.0.0.1:9000,http://localhost:5173
      MEDUSA_BACKEND_URL: http://localhost:9000
  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_b404919928983245cae4847b1ba20c63585a4b84711e4d3c74e4ba250f01418c
    container_name: medusa-storefront
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:8000"
    environment:
      MEDUSA_BACKEND_URL: http://backend:9000
      NEXT_PUBLIC_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_b404919928983245cae4847b1ba20c63585a4b84711e4d3c74e4ba250f01418c
      NEXT_PUBLIC_DEFAULT_REGION: us
      REVALIDATE_SECRET: supersecret
volumes:
  postgres_data:
  redis_data:
